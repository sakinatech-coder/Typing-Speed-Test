<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed Test & Word Rain Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <h1>⌨️ Typing Master</h1>
    <button id="themeBtn" class="icon-btn" title="Dark mode">🌙</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-mode="test">⏱️ Speed Test</button>
    <button class="tab" data-mode="game">🎮 Word Rain Game</button>
  </nav>

  <!-- ========== SPEED TEST ========== -->
  <section id="testMode" class="panel">
    <div class="controls">
      <label>Difficulty
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <label>Time
        <select id="duration">
          <option value="30">30 sec</option>
          <option value="60" selected>60 sec</option>
          <option value="120">120 sec</option>
        </select>
      </label>
      <button id="restartTest" class="btn">Restart</button>
    </div>

    <div class="stats">
      <div class="stat"><span id="tTime">60</span><small>Time</small></div>
      <div class="stat"><span id="tWpm">0</span><small>WPM</small></div>
      <div class="stat"><span id="tAcc">100%</span><small>Accuracy</small></div>
      <div class="stat"><span id="tMis">0</span><small>Mistakes</small></div>
      <div class="stat best"><span id="tBest">0</span><small>Best WPM</small></div>
    </div>

    <div id="textBox" class="text-box"></div>
    <textarea id="typeInput" placeholder="Start typing here… the timer starts with your first key" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  </section>

  <!-- ========== WORD RAIN GAME ========== -->
  <section id="gameMode" class="panel hidden">
    <div class="stats">
      <div class="stat"><span id="gScore">0</span><small>Score</small></div>
      <div class="stat"><span id="gLives">❤️❤️❤️</span><small>Lives</small></div>
      <div class="stat"><span id="gLevel">1</span><small>Level</small></div>
      <div class="stat best"><span id="gBest">0</span><small>Best Score</small></div>
    </div>

    <div id="arena" class="arena">
      <div id="arenaMsg" class="arena-msg">Type the falling words before they hit the ground!<br>Press <b>Start</b> to play.</div>
    </div>

    <div class="game-bar">
      <input id="gameInput" type="text" placeholder="Type the word here…" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
      <button id="startGame" class="btn">Start</button>
      <button id="pauseGame" class="btn ghost" disabled>Pause</button>
    </div>
  </section>

</div>

<!-- RESULT POPUP -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="mTitle"></h2>
    <div id="mBody" class="m-body"></div>
    <button id="mBtn" class="btn">Try Again</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
